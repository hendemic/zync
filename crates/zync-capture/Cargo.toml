[package]
name = "zync-capture"
version.workspace = true
edition.workspace = true
license.workspace = true

# The only crate that talks to a native screen-capture API, and therefore the
# only one allowed `unsafe`. Every backend's dependencies are gated to its
# target so no platform carries another's toolchain requirements.
[dependencies]
zync-core.workspace = true
zync-adapters.workspace = true
anyhow.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd.workspace = true
gstreamer.workspace = true
gstreamer-app.workspace = true
gstreamer-video.workspace = true
tokio.workspace = true
xcap.workspace = true
